[base]
package = ocean
env_name = puffer_viz_breakout
policy_name = VizBreakout
rnn_name = Recurrent

[vec]
num_envs = 6

[env]
num_envs = 128
frameskip = 4

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 100_000_000 


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
mean = 4
scale = 2.0
